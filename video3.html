<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Просмотр видео</title>
  <style>
    body {
      margin: 0;
      background-color: rgb(0, 0, 0);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    video {
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <video id="video" autoplay>
    <source src="video3.mp4" type="video/mp4" />
    Твой браузер не поддерживает видео.
  </video>

  <script>
    const tg = window.Telegram.WebApp;
    const video = document.getElementById('video');
    tg.expand(); // Открыть WebApp на весь экран

    // Закрыть WebApp по окончанию видео
    video.onended = () => {
      tg.close();
    };

    // Запретить паузу и перемотку
    video.controls = false;
    video.addEventListener('contextmenu', e => e.preventDefault()); // правая кнопка
    video.addEventListener('pause', () => video.play());
  </script>
</body>
</html>
