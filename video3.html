<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Видео 3</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    video {
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <video id="video" autoplay>
    <source src="video3.mp4" type="video/mp4">
    Твой браузер не поддерживает видео.
  </video>

  <script>
    const video = document.getElementById('video');
    video.onended = () => {
      Telegram.WebApp.sendData("watched");
      Telegram.WebApp.close();
    };
  </script>
</body>
</html>
