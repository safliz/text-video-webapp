<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Видео 1</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: black;
    }
    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <video id="video" autoplay>
    <source src="video1.mp4" type="video/mp4">
    Твой браузер не поддерживает видео.
  </video>

  <script>
    const video = document.getElementById('video');
    video.onended = () => {
      setTimeout(() => {
        Telegram.WebApp.close();
      }, 500); // немного подождать для надёжности
    };

    // Открываем на весь экран сразу
    window.addEventListener('load', () => {
      video.requestFullscreen?.() || video.webkitRequestFullscreen?.() || video.msRequestFullscreen?.();
    });
  </script>
</body>
</html>
